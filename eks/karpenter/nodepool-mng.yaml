apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: developrs-workshop-pool
spec:
  template:
    metadata:
      labels:
        workload-type: developers-workshop
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: workload-type
          value: developers-workshop
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["t"]
        - key: eks.amazonaws.com/instance-cpu
          operator: In
          values: ["1", "2", "4"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  limits:
    cpu: "4000"
    memory: 4000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 0s
