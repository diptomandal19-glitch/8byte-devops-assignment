apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  annotations:
    kubernetes.io/description: "Example EC2NodeClass"
  name: default
spec:
  role: eksctl-KarpenterNodeRole-managednode-quickstart-karpenter
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: managednode-quickstart-karpenter
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: managednode-quickstart-karpenter
  amiSelectorTerms:
    - alias: al2023@latest
